<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education — Project: Kerala Vision</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=2">

  <style>
    .kv-placeholder {
      width: 100%;
      padding: 4rem 3rem;
    }

    .kv-placeholder-inner {
      max-width: 36rem;
    }

    .kv-eyebrow {
      font-family: var(--font-spec);
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      color: var(--color-gold);
      text-transform: uppercase;
      margin: 0 0 1.25rem;
    }

    .kv-placeholder-title {
      font-family: var(--font-display);
      font-size: clamp(2.75rem, 8vw, 5rem);
      line-height: 0.95;
      color: var(--color-burgundy);
      margin: 0 0 1.5rem;
    }

    .kv-rule {
      width: 4rem;
      height: 2px;
      background: var(--color-gold);
      margin: 0 0 2rem;
    }

    .kv-placeholder-body {
      font-family: var(--font-book);
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--color-sepia);
    }

    @media (max-width: 639px) {
      .kv-placeholder {
        padding: 3rem 1.6rem;
      }
    }
  </style>
</head>
<body data-page="education">

  <div id="kv-deck" class="kv-deck-top">
    <section class="kv-placeholder">
      <div class="kv-placeholder-inner">
        <p class="kv-eyebrow">Project: Kerala Vision</p>
        <h1 class="kv-placeholder-title">Education</h1>
        <div class="kv-rule"></div>
        <p class="kv-placeholder-body">This section is coming soon.</p>
      </div>
    </section>
  </div>

  <script src="nav.js?v=2"></script>
</body>
</html>
